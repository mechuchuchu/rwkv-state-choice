[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-state-choice"
version = "0.1.0"
description = "RWKV-7 recurrent-state choice matching experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11,<2.12",
    "transformers>=5.15,<6",
    "datasets>=5,<6",
    "PyYAML>=6,<7",
    "safetensors>=0.8,<1",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

